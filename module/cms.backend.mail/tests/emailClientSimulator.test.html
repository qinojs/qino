<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>emailClientSimulator</title>
<!--
  Browser test, the simulator needs DOMParser and CSSOM. Open this file, or run it headless:
  google-chrome --headless --allow-file-access-from-files --dump-dom .../emailClientSimulator.test.html
-->
<body>
<pre id=out></pre>
<script type=module>
import { EmailClientSimulator, clients } from '../pub/emailClientSimulator.js';

const results = [];
const test = (name, fn) => {
  try { fn(); results.push(`ok   ${name}`); }
  catch (e) { results.push(`FAIL ${name}\n     ${e.message}`); }
};
const ok = (cond, msg) => { if (!cond) throw new Error(msg); };
const has = (text, part) => ok(text.includes(part), `expected ${part}\nin ${text}`);
const hasNot = (text, part) => ok(!text.includes(part), `unexpected ${part}\nin ${text}`);

const render = (src, client) => new EmailClientSimulator(src).render(client);
const found = view => view.report.map(r => `${r.what} (${r.why})`).join(' | ');

test('only written declarations are judged, not the longhands of a shorthand', () => {
  const view = render('<div style="background:#f3f3f3">x</div>', 'outlookWord');
  has(view.html, 'background: rgb(243, 243, 243)');
  ok(view.report.length === 0, `expected no findings, got ${found(view)}`);
});

test('of an ignored shorthand only the ignored parts go', () => {
  const view = render('<div style="background:url(a.png) center #fff">x</div>', 'outlookWord');
  hasNot(view.html, 'a.png');
  has(view.html, 'background-color: rgb(255, 255, 255)');
  ok(view.report.length === 1, `expected one finding, got ${found(view)}`);
});

test('a shorthand is reported once, not per longhand', () => {
  const view = render('<div style="border-radius:8px;border:1px solid red">x</div>', 'outlookWord');
  has(view.html, 'border: 1px solid red');
  hasNot(view.html, 'border-radius');
  ok(view.report.length === 1, `expected one finding, got ${found(view)}`);
});

test('profiles differ: what Word drops, Apple Mail keeps', () => {
  const src = '<div style="box-shadow:0 0 2px red">x</div>';
  hasNot(render(src, 'outlookWord').html, 'box-shadow');
  has(render(src, 'appleMail').html, 'box-shadow');
});

test('style sheets are filtered by property, selector and at-rule', () => {
  const view = render('<style>.a{border-radius:4px;color:red} a:hover{color:blue} @media (max-width:600px){.a{color:green}}</style>', 'outlookWord');
  has(view.html, 'color: red');
  hasNot(view.html, 'border-radius');
  hasNot(view.html, 'a:hover');
  hasNot(view.html, '@media');
});

test('CSS variables are resolved away where the client has none', () => {
  const view = render('<div style="--brand:red;color:var(--brand)">x</div>', 'gmailWeb');
  hasNot(view.html, 'var(--brand)');
  ok(view.report.length === 2, `expected two findings, got ${found(view)}`);
});

test('conditional comments follow the mso version', () => {
  const src = '<!--[if gte mso 9]>WORD<![endif]--><!--[if lt mso 9]>OLD<![endif]--><!--[if !mso]><!-->REST<!--<![endif]-->';
  const word = render(src, 'outlookWord').html;
  has(word, 'WORD');
  hasNot(word, 'OLD');
  hasNot(word, 'REST');
  const gmail = render(src, 'gmailWeb').html;
  hasNot(gmail, 'WORD');
  has(gmail, 'REST');
});

test('VML renders in the Word engine and vanishes elsewhere', () => {
  const src = '<!--[if mso]><v:roundrect arcsize="10%" fillcolor="#ff0000" href="https://x" style="width:200px;height:40px;v-text-anchor:middle"><v:textbox><center>Button</center></v:textbox></v:roundrect><![endif]-->';
  const word = render(src, 'outlookWord').html;
  has(word, 'href="https://x"');
  has(word, 'border-radius: 4px');   // 10% of the 40px side
  has(word, 'display: flex');        // v-text-anchor:middle
  has(word, 'Button');
  hasNot(render(src, 'gmailWeb').html, 'Button');
});

test('scripting is stripped for every client', () => {
  for (const key of Object.keys(clients)) {
    const view = render('<script>alert(1)<\/script><a href="javascript:alert(2)" onclick="alert(3)">x</a>', key);
    hasNot(view.html, 'alert(1)');
    hasNot(view.html, 'onclick');
    hasNot(view.html, 'javascript:');
  }
});

test('embedded and linked style sheets follow the client', () => {
  const src = '<style>.a{color:red}</style><link rel=stylesheet href=out.css>';
  has(render(src, 'gmailWeb').html, 'color: red');
  hasNot(render(src, 'gmailApp').html, 'color: red');
  hasNot(render(src, 'gmailWeb').html, 'out.css');
  has(render(src, 'appleMail').html, 'out.css');
});

test('check() reports what render() cannot show', () => {
  const sim = new EmailClientSimulator('<img src=a.png>');
  ok(sim.check('outlookWord').some(r => r.where === '<img alt>'), 'expected a missing alt');
  ok(sim.check('outlookWord').some(r => r.where === 'layout'), 'expected the table layout hint');
  const big = new EmailClientSimulator('<p>' + 'x'.repeat(110000) + '</p>');
  ok(big.check('gmailWeb').some(r => r.where === 'size'), 'expected the clipping warning');
  ok(!big.check('appleMail').some(r => r.where === 'size'), 'Apple Mail does not clip');
});

test('the source stays untouched, so one instance serves every client', () => {
  const sim = new EmailClientSimulator('<div style="border-radius:8px">x</div>');
  const first = sim.render('outlookWord').html;
  sim.render('appleMail');
  ok(sim.render('outlookWord').html === first, 'render is not repeatable');
  has(sim.source, 'border-radius:8px');
});

test('an unknown client is refused', () => {
  let failed = false;
  try { render('<p>x</p>', 'lotusNotes'); } catch { failed = true; }
  ok(failed, 'expected a RangeError');
});

const failures = results.filter(r => r.startsWith('FAIL')).length;
document.title = failures ? `FAIL ${failures}/${results.length}` : `PASS ${results.length}`;
document.getElementById('out').textContent = `${document.title}\n\n${results.join('\n')}`;
</script>
