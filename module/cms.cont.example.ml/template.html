<div>

  <!-- cms-text: tag wird zum wrapper, inner html ist der initial-inhalt (default-sprache) -->
  <h2 cms-text=title>Example <b>title</b></h2>
  <div cms-text=main></div>

  <!-- if: solange leer, für besucher ausgeblendet -->
  <p cms-text=note if></p>

  <!-- cms-image: ein bild für alle sprachen -->
  <cms-image name=image1 width=110 height=110 fit=contain />

  <!-- cms-image localized: ein bild pro sprache -->
  <cms-image name=logo width=110 height=110 localized />

  <!-- cms-cont: eingebetteter sub-content node -->
  <cms-cont name=body module=cms.cont.text />

</div>
