name: Publish to JSR

on:
  push:
    branches:
      - main
    paths:
      - deno.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2

      # `--all` follows the browser files under pub/ too, and those import u2 and item.js from a cdn.
      # Naming any host replaces deno's default allowlist, so jsr.io has to be listed as well.
      - run: deno check --all --allow-import=jsr.io:443,gcdn.li:443,cdn.jsdelivr.net:443
      - run: deno task test

      - name: Version lesen
        id: version
        run: echo "version=$(jq -r '.version' deno.json)" >> $GITHUB_OUTPUT

      - name: Tag + Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - run: deno publish --allow-slow-types
